<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>선교영상 26-4기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;600&display=swap">
<style>
  /* Layout: one wide screening card (player) with a quiet info rail; stacks on phones. */
  :root{
    --bg:#f3f5f7; --panel:#ffffff; --ink:#1c2430; --muted:#5d6876; --line:#dde3ea;
    --accent:#1f5f8b; --accent-ink:#ffffff; --soft:#e4eef6;
    --display:"Gowun Batang","Batang",serif;
    --body:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#11161c; --panel:#1a2129; --ink:#e8edf2; --muted:#9aa6b3; --line:#2a333d;
    --accent:#7db7e0; --accent-ink:#0c1620; --soft:#1d2c3a; color-scheme:dark } }
  :root[data-theme="dark"]{
    --bg:#11161c; --panel:#1a2129; --ink:#e8edf2; --muted:#9aa6b3; --line:#2a333d;
    --accent:#7db7e0; --accent-ink:#0c1620; --soft:#1d2c3a; color-scheme:dark }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px}
  .wrap{max-width:1100px;margin:0 auto;padding-block:28px 48px;
    padding-left:max(16px, env(safe-area-inset-left, 0px));
    padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .logo{display:block;margin:0 0 22px}
  .logo img{display:block;width:min(340px,80vw);max-width:100%;height:auto}
  .eyebrow{font-size:13px;letter-spacing:.08em;color:var(--accent);font-weight:600;margin:0 0 6px}
  h1{font-family:var(--display);font-size:clamp(28px,5vw,40px);margin:0 0 6px;text-wrap:balance}
  .sub{color:var(--muted);margin:0 0 22px}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
  @media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}
  video{display:block;width:100%;max-width:100%;aspect-ratio:888/528;background:#000}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
  .bar label{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px;cursor:pointer;margin-right:auto}
  button{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    padding:9px 16px;border-radius:10px;cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .info{background:var(--soft);border-radius:16px;padding:18px;display:grid;gap:12px;min-width:0}
  .info dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:15px}
  .info dt{color:var(--muted)} .info dd{margin:0;font-variant-numeric:tabular-nums}
  .hint{font-size:13px;color:var(--muted);line-height:1.7;margin:0}
</style>

<div class="wrap">
  <picture class="logo">
    <source srcset="logo-white.svg" media="(prefers-color-scheme: dark)">
    <img src="logo.svg" alt="제칠일안식일예수재림교회" width="833" height="176">
  </picture>
  <p class="eyebrow">SDA 2026 · 선교영상</p>
  <h1>선교영상 26-4기</h1>
  <p class="sub">재생 버튼을 누르면 바로 시작합니다.</p>

  <div class="grid">
    <div class="stage">
      <video id="player" src="mission-26-4.mp4" controls playsinline preload="metadata"></video>
      <div class="bar">
        <label><input type="checkbox" id="loop"> 끝나면 처음부터 반복</label>
        <button id="fs" class="primary" type="button">전체화면</button>
      </div>
    </div>
    <aside class="info">
      <dl>
        <dt>기수</dt><dd>2026년 4기</dd>
        <dt>길이</dt><dd>2분 57초</dd>
      </dl>
      <p class="hint">스페이스바: 재생/멈춤 · F: 전체화면 · ←/→: 10초 이동</p>
    </aside>
  </div>
</div>

<script>
  const player = document.getElementById("player");
  const loop = document.getElementById("loop");
  loop.addEventListener("change", () => { player.loop = loop.checked; });
  function goFull(){ try { const p = player.requestFullscreen && player.requestFullscreen(); if (p) p.catch(() => {}); } catch(e) {} }
  document.getElementById("fs").addEventListener("click", goFull);
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === " ") { e.preventDefault(); player.paused ? player.play().catch(()=>{}) : player.pause(); }
    else if (e.key === "f" || e.key === "F") goFull();
    else if (e.key === "ArrowRight") player.currentTime += 10;
    else if (e.key === "ArrowLeft") player.currentTime -= 10;
  });
</script>

</body>
</html>
