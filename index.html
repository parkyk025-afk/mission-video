<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>선교영상 26-4기</title>
<meta property="og:title" content="선교영상 26-4기">
<meta property="og:description" content="SDA 2026 선교영상 26-4기 · 2분 57초">
<meta property="og:image" content="https://parkyk025-afk.github.io/mission-video/iceland.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;600&display=swap">
<style>
  /* Layout: full-bleed Iceland photo behind everything, dark gradient for legibility,
     title block over the sky, the film framed in a glass panel below. Single dark look on purpose. */
  :root{
    color-scheme:dark;
    --ink:#f4f7fa; --muted:#c9d3dc; --glass:rgba(12,20,28,.55); --line:rgba(255,255,255,.18);
    --accent:#f2c14e; --accent-ink:#1b1606; --night:#0b1118;
    --display:"Gowun Batang","Batang",serif;
    --body:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{color:var(--ink);font-family:var(--body);font-size:16px;min-height:100vh;background:var(--night)}
  .bg{position:fixed;inset:0;z-index:0;
    background:
      linear-gradient(90deg, rgba(8,14,20,.62) 0%, rgba(8,14,20,.25) 55%, rgba(8,14,20,.10) 100%),
      linear-gradient(180deg, rgba(8,14,20,.45) 0%, rgba(8,14,20,.30) 35%, rgba(8,14,20,.70) 72%, rgba(8,14,20,.92) 100%),
      url("iceland.jpg") center 35% / cover no-repeat;
    animation:drift 40s ease-in-out infinite alternate}
  @keyframes drift{from{transform:scale(1)}to{transform:scale(1.06)}}
  .wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding-block:32px 40px;
    padding-left:max(16px, env(safe-area-inset-left, 0px));
    padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .logo{display:block;width:min(300px,72vw);max-width:100%;height:auto;margin:0 0 clamp(40px,10vh,110px);
    filter:drop-shadow(0 2px 8px rgba(0,0,0,.35))}
  .eyebrow{font-size:13px;letter-spacing:.22em;color:var(--accent);font-weight:600;margin:0 0 10px;text-transform:uppercase}
  h1{font-family:var(--display);font-size:clamp(38px,8vw,72px);line-height:1.08;margin:0 0 12px;text-wrap:balance;
    text-shadow:0 4px 24px rgba(0,0,0,.45)}
  .sub{color:var(--ink);font-size:clamp(16px,2.2vw,19px);margin:0 0 28px;max-width:34em;line-height:1.6;
    text-shadow:0 2px 10px rgba(0,0,0,.5)}
  .cta{display:inline-flex;align-items:center;gap:10px;font:inherit;font-weight:600;font-size:17px;cursor:pointer;
    border:0;border-radius:999px;padding:13px 26px;background:var(--accent);color:var(--accent-ink);
    box-shadow:0 10px 30px rgba(242,193,78,.35);margin-bottom:clamp(40px,8vh,80px)}
  .cta::before{content:"";border-style:solid;border-width:7px 0 7px 11px;border-color:transparent transparent transparent currentColor}
  .cta:hover{filter:brightness(1.06);transform:translateY(-1px)}
  .film{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:12px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 30px 60px rgba(0,0,0,.45)}
  video{display:block;width:100%;max-width:100%;aspect-ratio:888/528;background:#000;border-radius:12px}
  .bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 6px 4px}
  .meta{display:flex;gap:8px;flex-wrap:wrap;margin-right:auto}
  .chip{font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);
    font-variant-numeric:tabular-nums}
  .bar label{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px;cursor:pointer}
  button.fs{font:inherit;font-size:14px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);
    padding:8px 16px;border-radius:999px;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  footer{margin-top:22px;font-size:12px;color:var(--muted);opacity:.8}
  @media (prefers-reduced-motion: reduce){ .bg{animation:none} }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="wrap">
  <img class="logo" src="logo-white.svg" alt="제칠일안식일예수재림교회" width="833" height="176">

  <p class="eyebrow">SDA 2026 · Mission Film</p>
  <h1>선교영상 26-4기</h1>
  <p class="sub">땅끝까지 이르러 내 증인이 되리라. 2026년 넷째 선교 이야기를 함께 보세요.</p>
  <button class="cta" id="watch" type="button">영상 보기</button>

  <section class="film" id="film">
    <video id="player" src="mission-26-4.mp4" poster="poster.jpg" controls playsinline preload="metadata"></video>
    <div class="bar">
      <div class="meta"><span class="chip">2026 · 4기</span><span class="chip">2분 57초</span></div>
      <label><input type="checkbox" id="loop"> 반복 재생</label>
      <button class="fs" id="fs" type="button">전체화면</button>
    </div>
  </section>

  <footer>배경 사진: Kirkjufell, Iceland (Wikimedia Commons, CC0)</footer>
</div>

<script>
  const player = document.getElementById("player");
  document.getElementById("loop").addEventListener("change", e => { player.loop = e.target.checked; });
  function goFull(){ try { const p = player.requestFullscreen && player.requestFullscreen(); if (p) p.catch(() => {}); } catch(e) {} }
  document.getElementById("fs").addEventListener("click", goFull);
  document.getElementById("watch").addEventListener("click", () => {
    document.getElementById("film").scrollIntoView({behavior:"smooth", block:"center"});
    player.play().catch(() => {});
  });
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "BUTTON") return;
    if (e.key === " ") { e.preventDefault(); player.paused ? player.play().catch(()=>{}) : player.pause(); }
    else if (e.key === "f" || e.key === "F") goFull();
    else if (e.key === "ArrowRight") player.currentTime += 10;
    else if (e.key === "ArrowLeft") player.currentTime -= 10;
  });
</script>
</body>
</html>
